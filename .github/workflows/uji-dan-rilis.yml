# Menguji semua format di Chrome.
# Tag v* (mis. v1.0.2) atau Release baru di GitHub: rak-baca.html dilampirkan ke rilis.
name: Uji & rilis

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pastikan rak-baca.html sesuai src/
        run: |
          sh tools/build.sh
          git diff --exit-code -- rak-baca.html

      - name: Tag rilis harus sama dengan isi berkas VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          test "${GITHUB_REF_NAME#v}" = "$VER" || { echo "Tag $GITHUB_REF_NAME tidak sama dengan VERSION ($VER)"; exit 1; }

      - name: Uji semua format di Chrome
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          node tools/make-samples.js "$RUNNER_TEMP/contoh"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" CHROME_PATH="$(command -v google-chrome)" node tools/test-reader.js "$RUNNER_TEMP/contoh"

      - name: Lampirkan ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rak-baca.html --clobber
          else
            gh release create "$TAG" rak-baca.html --title "Rak Baca ${TAG#v}" --notes "Pakai salah satu:
          - **Versi online:** https://ciesha97.github.io/rak-baca/ (tanpa unduh apa pun).
          - **rak-baca.html:** unduh lalu klik dua kali untuk membuka di Chrome/Edge di komputer mana pun, tanpa internet.

          Terjemahan bawaan butuh Google Chrome 138 atau lebih baru di komputer."
          fi
