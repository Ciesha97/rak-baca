# Sekali pakai: hapus rilis v1.0.1 yang kosong dan usang. Tag git v1.0.1 tetap disimpan.
name: Hapus rilis v1.0.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hapus:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then gh release delete v1.0.1 --yes; else echo "Rilis v1.0.1 sudah tidak ada"; fi
          gh release list
