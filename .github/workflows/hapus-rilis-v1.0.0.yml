# Sekali pakai: hapus rilis v1.0.0 yang masih berisi installer Windows. Tag git v1.0.0 tetap disimpan.
name: Hapus rilis v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hapus:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then gh release delete v1.0.0 --yes; else echo "Rilis v1.0.0 sudah tidak ada"; fi
          gh release list
